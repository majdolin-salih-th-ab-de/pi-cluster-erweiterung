services:
  main:
    build: .
    container_name: cluster_main
    image: pi_cluster:latest
    networks:
      - pi_net
    environment:
      - TOTAL_SAMPLES=3000000
      - EXPECTED_WORKERS=50
    volumes:
      - ./src/:/src
    ports:
      - "5001:5001"
    #command: ["python", "main.py"]  # Dummy Command weiterhin aktiv

  worker:
    build: .
    image: pi_cluster:latest
    networks:
      - pi_net
    deploy:
      replicas: 5
    environment:
      - MAIN_HOST=10.97.3.24
      - MAIN_PORT=5001
    volumes:
      - ./src/:/src
    command: ["python", "worker.py"]

networks:
  pi_net:
    driver: bridge
